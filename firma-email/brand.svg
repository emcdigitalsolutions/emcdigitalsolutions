<?xml version="1.0" encoding="UTF-8"?>
<!--
  "EMC Digital Solutions" con gradient blu→oro coerente col logo.
  Renderizzato come PNG per essere usato come <img> nella firma email.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="800" height="60">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0e1529"/>
      <stop offset="40%"  stop-color="#1a2548"/>
      <stop offset="70%"  stop-color="#8b6f1f"/>
      <stop offset="100%" stop-color="#f5c542"/>
    </linearGradient>
  </defs>
  <text x="0" y="42"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="36" font-weight="700" letter-spacing="0.4"
        fill="url(#g2)">EMC Digital Solutions</text>
</svg>
