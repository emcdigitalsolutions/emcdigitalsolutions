<?xml version="1.0" encoding="UTF-8"?>
<!--
  Telefono con icona smartphone vettoriale (no emoji, garantisce gradient
  coerente anche per l'icona).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 38" width="540" height="38">
  <defs>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#6b9ef7"/>
      <stop offset="50%" stop-color="#93b8fc"/>
      <stop offset="100%" stop-color="#f5c542"/>
    </linearGradient>
  </defs>

  <!-- Icona smartphone (corpo + schermo + speaker + pulsante home) -->
  <g transform="translate(2 4)">
    <rect x="0" y="0" width="22" height="32" rx="4" ry="4"
          fill="none" stroke="url(#g4)" stroke-width="2.4"/>
    <rect x="3" y="6" width="16" height="20" rx="0.5" fill="url(#g4)" opacity="0.18"/>
    <rect x="9" y="2" width="4" height="1.4" rx="0.7" fill="url(#g4)"/>
    <circle cx="11" cy="29" r="1.2" fill="url(#g4)"/>
  </g>

  <!-- Numero -->
  <text x="38" y="28"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="700" letter-spacing="0.6"
        fill="url(#g4)">+39 329 4348075</text>
</svg>
