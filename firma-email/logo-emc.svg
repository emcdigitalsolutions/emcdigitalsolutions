<?xml version="1.0" encoding="UTF-8"?>
<!--
  EMC Digital Solutions — Logo per firma email.
  Dimensione design 320×320 (visualizzato tipicamente a 90×90 px nel rendering email).
  Sfondo trasparente, gradient blu→oro fedele al biglietto da visita.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0e1529"/>
      <stop offset="50%"  stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0f1728"/>
    </linearGradient>
    <linearGradient id="chevGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#6b9ef7"/>
      <stop offset="60%" stop-color="#93b8fc"/>
      <stop offset="100%" stop-color="#f5c542"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#6b9ef7"/>
      <stop offset="50%" stop-color="#93b8fc"/>
      <stop offset="100%" stop-color="#f5c542"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#4a7fd4"/>
      <stop offset="35%" stop-color="#6b9ef7"/>
      <stop offset="65%" stop-color="#93b8fc"/>
      <stop offset="85%" stop-color="#d4b84a"/>
      <stop offset="100%" stop-color="#f5c542"/>
    </linearGradient>
  </defs>

  <!-- Sfondo arrotondato blu notte -->
  <rect x="0" y="0" width="320" height="320" rx="50" fill="url(#bgGrad)"/>

  <!-- Glow blu top-left -->
  <ellipse cx="60" cy="60" rx="120" ry="80" fill="#6b9ef7" opacity="0.07"/>
  <!-- Glow oro bottom-right -->
  <ellipse cx="260" cy="260" rx="100" ry="70" fill="#f5c542" opacity="0.05"/>

  <!-- 3 chevron orizzontali (la "E" stilizzata) — centrati con il wordmark sotto.
       Larghezza chevron = 132u. Per centrare in viewBox 320, offset = (320-132)/2 = 94. -->
  <g transform="translate(94 70)">
    <path d="M4,4 H100 L132,18 L100,32 H4 A14,14 0 0,1 4,4Z" fill="url(#chevGrad)"/>
    <path d="M4,46 H84 L116,60 L84,74 H4 A14,14 0 0,1 4,46Z" fill="url(#chevGrad)" opacity="0.85"/>
    <path d="M4,88 H100 L132,102 L100,116 H4 A14,14 0 0,1 4,88Z" fill="url(#chevGrad)"/>
  </g>

  <!-- Wordmark "EMC" -->
  <text x="160" y="240" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="6"
        fill="url(#textGrad)">EMC</text>

  <!-- Sub "Digital Solutions" -->
  <text x="160" y="268" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="400" letter-spacing="3"
        fill="#8a92a3">DIGITAL SOLUTIONS</text>

  <!-- Bottom accent line -->
  <rect x="0" y="312" width="320" height="8" fill="url(#accentGrad)"/>
</svg>
