<?xml version="1.0" encoding="UTF-8"?>
<!--
  "Enrico Maria Caruso" con gradient blu→oro coerente col logo.
  Renderizzato come PNG per essere usato come <img> nella firma email
  (gradient testo non supportato da Outlook/Gmail mobile via CSS).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 70" width="720" height="70">
  <text x="0" y="50"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" letter-spacing="0.5"
        fill="#0e1529">Enrico Maria Caruso</text>
</svg>
