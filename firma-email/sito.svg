<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sito con icona globo vettoriale (cerchio + meridiano verticale + ellissi
  per latitudini, render uguale al gradient del logo).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 38" width="660" height="38">
  <defs>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#6b9ef7"/>
      <stop offset="50%" stop-color="#93b8fc"/>
      <stop offset="100%" stop-color="#f5c542"/>
    </linearGradient>
  </defs>

  <!-- Icona globo -->
  <g transform="translate(4 4)">
    <circle cx="15" cy="15" r="14" fill="none" stroke="url(#g5)" stroke-width="2.4"/>
    <ellipse cx="15" cy="15" rx="6.5" ry="14" fill="none" stroke="url(#g5)" stroke-width="2"/>
    <line x1="1" y1="15" x2="29" y2="15" stroke="url(#g5)" stroke-width="2"/>
    <line x1="15" y1="1" x2="15" y2="29" stroke="url(#g5)" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Sito -->
  <text x="42" y="28"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="700" letter-spacing="0.4"
        fill="url(#g5)">www.emcdigitalsolutions.it</text>
</svg>
